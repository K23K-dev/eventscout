[project]
name = "eventscout-api"
version = "0.1.0"
description = "EventScout backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135,<1",
    "pydantic-settings>=2,<3",
    "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eventscout_api"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "anyio>=4,<5",
    "httpx>=0.28,<1",
    "mypy>=1,<2",
    "pytest>=8,<10",
    "ruff>=0.15,<1",
]
