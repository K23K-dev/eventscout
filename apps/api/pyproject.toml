[project]
name = "eventscout-api"
version = "0.1.0"
description = "EventScout backend"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "fastapi>=0.135,<1",
    "httpx>=0.28,<1",
    "icalendar>=6,<8",
    "langgraph>=1.2,<2",
    "openai>=3.19,<4",
    "pinecone>=10,<11",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2,<3",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[dependency-groups]
dev = [
    "mypy>=1,<2",
    "ruff>=0.15,<1",
    "types-beautifulsoup4>=4.12,<5",
]
